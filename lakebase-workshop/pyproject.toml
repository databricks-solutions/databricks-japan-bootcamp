[project]
name = "lakebase-workshop"
version = "0.1.0"
description = "Databricks Lakebase workshop demo app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.3.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
