# Reconciler 設定ファイル
# Source / Target ともに Databricks テーブルを指す。
# <catalog>, <schema> を自分の環境に合わせて修正。

source_catalog: main
source_schema: recon_src
target_catalog: main
target_schema: recon_tgt

tables:
  - source_name: orders
    target_name: orders
    jdbc_reader_options: null
    join_columns:
      - order_id
    select_columns:
      - order_id
      - customer_id
      - order_date
      - order_status
      - total_amount
    # 必要に応じて列マッピングや閾値も設定できる
    column_mapping: []
    transformations: []
    thresholds: []
    filters:
      source: null
      target: null
